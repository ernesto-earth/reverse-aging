<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Reverse Aging Routinen – Handy Kraft</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14201C}a:hover{color:#C2410C}
.seg{flex:1;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:8px;min-height:44px;cursor:pointer}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;min-height:44px;font-size:11px;font-weight:600;text-decoration:none;color:#B8C2BC}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F4EF; font-family: Inter, system-ui, sans-serif; color: #14201C">

<header style="background: #14201C; padding: 14px 20px 16px; display: flex; align-items: center; gap: 12px">
<a href="MobilStart.dc.html" aria-label="Zurück zum Überblick" style="width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<div>
<div style="font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9FD3C5">Wöchentlich</div>
<h1 style="margin: 2px 0 0; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1; color: #FFFFFF">Kraft · 2 × pro Woche</h1>
</div>
</header>

<div style="padding: 14px 16px 0">
<div role="tablist" aria-label="Trainingspfad" style="display: flex; gap: 4px; background: #E4E7E0; padding: 4px; border-radius: 11px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button class="seg" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; margin: 12px 2px 8px">
<span style="font-size: 13px; color: #4A5752">{{sub}}</span>
<span class="tag" style="{{tagStyle}}">{{tagLabel}}</span>
</div>

<div style="background: #FFFFFF; border-radius: 14px; padding: 2px 16px">
<sc-for list="{{ex}}" as="e" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #E4E7E0">
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; width: 20px; color: #C2410C">{{e.n}}</span>
<span style="flex: 1"><b style="display: block; font-size: 15px">{{e.name}}</b><span style="font-size: 12px; color: #4A5752">{{e.muscle}}</span></span>
<span style="font-size: 12px; font-weight: 600; background: #F3F4EF; border-radius: 6px; padding: 5px 7px; text-align: right">{{e.dose}}</span>
</div>
</sc-for>
</div>

<div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 12px">
<div style="background: #DDEEE9; border-radius: 9px; padding: 10px"><b style="display: block; color: #1F5F55">Woche 1–2</b>3–4 Wdh. Reserve</div>
<div style="background: #B9DDD3; border-radius: 9px; padding: 10px"><b style="display: block; color: #1F5F55">Woche 3–4</b>2–3 Wdh. Reserve</div>
<div style="background: #1F5F55; color: #FFFFFF; border-radius: 9px; padding: 10px"><b style="display: block">ab Woche 5</b>nahe Ermüdung</div>
</div>
<a href="#" style="display: flex; justify-content: space-between; margin-top: 10px; padding: 12px 4px; font-size: 14px; font-weight: 600; text-decoration: none; border-top: 1px solid #DDE1DA"><span>Vor jeder Einheit · Sicherheit</span><span aria-hidden="true">+</span></a>
</div>

<nav aria-label="Hauptnavigation" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: #14201C; padding: 0 6px 14px">
<a class="tab" href="MobilStart.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Überblick</a>
<a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>Morgen</a>
<a class="tab" href="MobilKraft.dc.html" aria-current="page" style="color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Kraft</a>
<a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Tests</a>
<a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mehr</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { path: 'A' }; }
renderVals() {
const P = {
A: { sub: 'Studio · je 1 Arbeitssatz, langsam', tagLabel: 'Autor-Interview', tagStyle: 'background: #E3E8F2; color: #2B4C7E',
ex: [['1','Beinpresse','Oberschenkel, Gesäß','10–15 Wdh.'],['2','Brustpresse','Brust, Schulter','10–15 Wdh.'],['3','Latzug','Rücken, Armbeuger','10–15 Wdh.'],['4','Rückenstrecker','unterer Rücken','10–15 Wdh.'],['5','Bauchpresse','Bauch, Rumpf','10–15 Wdh.']] },
B: { sub: 'Daheim · dieselben 5 Muster', tagLabel: 'Redaktionell', tagStyle: 'background: #ECEDE8; color: #4A5752',
ex: [['1','Aufstehen vom Stuhl','statt Beinpresse','1–2 × 8–15'],['2','Tisch-Liegestütz','statt Brustpresse','1–2 × 8–15'],['3','Rudern mit Band','statt Latzug','1–2 × 8–15'],['4','Hüftheben','Hüftstreckung','1–2 × 8–15'],['5','Dead Bug','Rumpf','1–2 × 6–12']] },
C: { sub: 'Kür · erst wenn A oder B sitzt', tagLabel: 'Magazin', tagStyle: 'background: #FBE7DC; color: #9A3412',
ex: [['0','Basis','drei Grundübungen','2 × / Woche'],['1','Dragon Flag','Rumpfspannung','Level 1'],['2','Bent-Arm-Planche','Schulter, Rumpf','Level 2'],['3','Front Lever','Rücken, Rumpf','Level 3'],['–','Ausrüstung','Stange, Barren','25–40 min']] }
};
const cur = P[this.state.path];
const tabs = [['A','Studio'],['B','Daheim'],['C','Kür']].map(([id,label]) => {
const sel = this.state.path === id;
return { label, sel: sel ? 'true' : 'false', pick: () => this.setState({ path: id }),
style: sel ? 'background: #14201C; color: #FFFFFF' : 'background: transparent; color: #14201C' };
});
return { tabs, sub: cur.sub, tagLabel: cur.tagLabel, tagStyle: cur.tagStyle,
ex: cur.ex.map(([n,name,muscle,dose]) => ({ n, name, muscle, dose })) };
}
}
</script>
</body>
</html>
